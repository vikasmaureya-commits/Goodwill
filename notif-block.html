<style>
/* ===== Benachrichtigungen ===== */
.bell,.hbtn{position:relative;}
.nbadge{position:absolute;top:1px;right:1px;min-width:14px;height:14px;padding:0 3px;border-radius:999px;background:#1F7A59;color:#fff;font-size:9.5px;font-weight:700;line-height:14px;text-align:center;font-variant-numeric:tabular-nums;border:1.5px solid #fff;box-sizing:content-box;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.15);}
.nsx{max-height:88dvh;overflow-y:auto;gap:12px;outline:none;}
.n-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.n-head h3{font-weight:500;font-size:1.45rem;letter-spacing:-.01em;}
.n-head .n-all{font-size:.85rem;font-weight:600;color:#2F6B55;padding:8px 10px;border-radius:12px;min-height:44px;}
.n-sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin:6px 0 -4px;}
.n-list{display:flex;flex-direction:column;gap:8px;}
.n-it{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid var(--line);}
.n-it.unread{background:#fff;border-color:rgba(79,122,104,.35);box-shadow:0 6px 18px -12px rgba(40,80,60,.45);}
.n-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(110,170,140,.18);}
.n-ic.warm{background:rgba(240,190,160,.4);} .n-ic.grey{background:rgba(120,135,128,.14);}
.n-ic svg{width:22px;height:22px;stroke:#2F6B55;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.n-ic.warm svg{stroke:#8A4A14;} .n-ic.grey svg{stroke:#5E6B64;}
.n-tx{min-width:0;}
.n-tx b{display:block;font-weight:600;font-size:.95rem;line-height:1.25;color:#2B3338;}
.n-it:not(.unread) .n-tx b{font-weight:500;}
.n-tx small{display:block;margin-top:2px;font-size:.82rem;color:#5F6A70;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.n-tx time{display:block;margin-top:4px;font-size:.74rem;color:var(--mute);}
.n-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.n-dot{width:10px;height:10px;border-radius:50%;background:#1F7A59;box-shadow:0 0 0 2px rgba(31,122,89,.2);}
.n-cta{font-size:.74rem;font-weight:600;color:#2F5B49;background:rgba(110,160,135,.22);padding:5px 10px;border-radius:999px;white-space:nowrap;}
.n-cta.warm{background:rgba(240,190,160,.45);color:#8A4A14;}
.n-empty{text-align:center;padding:26px 10px;color:var(--mute);}
.n-empty b{display:block;color:var(--ink);font-weight:500;font-size:1.1rem;margin-bottom:4px;}
.n-foot{display:flex;justify-content:center;}
.n-foot button{min-height:48px;padding:0 22px;border-radius:14px;font-weight:600;color:#2F6B55;border:1.3px solid rgba(47,107,85,.5);background:rgba(255,255,255,.6);}
</style>
<div class="scrim hidden" id="nscrim"></div>
<div class="sheet nsx hidden" id="nsheet" role="dialog" aria-modal="true" aria-labelledby="nTitle" tabindex="-1" data-dyn></div>
<script id="notif">
/* ============ BENACHRICHTIGUNGEN ============
   Werden aus dem echten App-Zustand gebildet (Chat, Bewertung, Entwurf,
   Freigabe, gesendete Anfragen, Bestellungen). Gelesen-Status wird gespeichert. */
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const en = () => LANG === 'en';
  const A = window.GWApp;
  const KEY = 'gw-notif-v1';

  let READ = {};
  try{ const x = JSON.parse(localStorage.getItem(KEY)); if(x && typeof x === 'object') READ = x; }catch(e){}
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(READ)); }catch(e){} };
  const markRead = ids => { ids.forEach(id => READ[id] = 1); save(); };

  const I = {
    chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg>',
    star:'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
    people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3 19c.4-3.2 2.6-5 6-5s5.6 1.8 6 5"/><path d="M16 6.5a3 3 0 0 1 0 5.5M18 14c1.7.5 2.7 2 3 5"/></svg>',
    send:'<svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 2.5 2.5 7L21 3z"/><path d="M10 13l11-10"/></svg>',
    check:'<svg viewBox="0 0 24 24"><path d="M4.5 12.8l5 5L19.5 7"/></svg>',
    heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.7 12 20 12 20z"/></svg>',
    bell:'<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>'
  };

  const ago = ts => {
    const m = Math.round((Date.now() - ts) / 60000);
    if(m < 1) return L('Gerade eben','Just now');
    if(m < 60) return L('vor '+m+' Min.', m+' min ago');
    const h = Math.round(m / 60);
    if(h < 24) return L('vor '+h+' Std.', h+' h ago');
    return new Date(ts).toLocaleDateString(en()?'en-GB':'de-DE',{weekday:'short',day:'numeric',month:'short'});
  };
  const itemNames = items => items.map(x => { try{ return iName(x.it || A.getItem(x.id) || {name:'?'}); }catch(e){ return '?'; } }).join(', ');

  /* ---------- Liste aus dem App-Zustand bilden ---------- */
  function build(){
    const out = [];
    const F = window.GWFlow && GWFlow.info ? GWFlow.info() : null;

    if(F && F.chat && F.chat.length){
      const last = F.chat[F.chat.length-1];
      out.push({id:'chat-'+F.chat.length, icon:'chat', urgent:F.chatUnread,
        title:L('Nachricht von Akash','Message from Akash'),
        text:en() ? (last.en || last.de) : last.de,
        when:L('Heute','Today'), cta:F.chatUnread ? L('Antworten','Reply') : L('Öffnen','Open'),
        go:() => GWFlow.openChat()});
    }
    if(window.GWHon && GWHon.pending && GWHon.pending()){
      out.push({id:'rate-akash', icon:'star', tone:'warm', urgent:true,
        title:L('Akash hat geliefert','Akash has delivered'),
        text:L('Ist alles angekommen? Ihre Bewertung hilft der Nachbarschaft.','Did everything arrive? Your rating helps the neighbourhood.'),
        when:L('Heute','Today'), cta:L('Bewerten','Rate'), ctaTone:'warm',
        go:() => GWHon.open('akash','rate')});
    }
    if(F && F.approval === 'pending' && F.care){
      out.push({id:'approval', icon:'people', tone:'warm', urgent:true,
        title:L('Wartet auf Freigabe','Waiting for approval'),
        text:F.care.name + L(' prüft Ihre Bestellung.',' is checking your order.'),
        when:L('Heute','Today'), go:() => goTab('req')});
    }
    if(F && F.draft){
      out.push({id:'draft-'+(F.draft.ts || F.draft.items.length), icon:'edit', tone:'warm',
        title:L('Ihr Entwurf ist gespeichert','Your draft is saved'),
        text:itemNames(F.draft.items),
        when:F.draft.ts ? ago(F.draft.ts) : L('Heute','Today'), cta:L('Fortsetzen','Continue'), ctaTone:'warm',
        go:() => GWFlow.resumeDraft()});
    }
    (A.state.reqs || []).forEach(r => {
      out.push({id:'req-'+r.ts, icon:'send', ts:r.ts,
        title:L('Anfrage gesendet','Request sent'),
        text:L('Helfer in Ihrer Nähe wurden informiert: ','Helpers near you were informed: ') + itemNames(r.items),
        when:ago(r.ts), go:() => goTab('req')});
    });
    (A.ORDERS || []).slice(0,3).forEach((o,i) => {
      out.push({id:'order-'+i+'-'+o.who, icon:'check', tone:'grey', old:true,
        title:L('Bestellung zugestellt','Order delivered'),
        text:L('Von ','By ') + o.who + ' · ' + (o.t ? o.t[en()?1:0] : L('Danke an Ihre Nachbarschaft!','Thanks to your neighbourhood!')),
        when:en() ? o.en : o.de, go:() => goTab('orders')});
    });
    out.push({id:'welcome', icon:'heart', tone:'grey', old:true,
      title:L('Willkommen bei Goodwill','Welcome to Goodwill'),
      text:L('Hier sehen Sie Nachrichten Ihrer Helfer und den Stand Ihrer Anfragen.','Here you see messages from your helpers and the status of your requests.'),
      when:'', go:null});

    out.forEach(n => { n.unread = n.urgent || (!n.old && !READ[n.id]); });
    return out;
  }

  function goTab(t){ A.state.nav = [t]; A.show(t, false); }

  /* ---------- Zeichnen ---------- */
  const row = (n, i) => `<button class="n-it${n.unread?' unread':''}" type="button" data-i="${i}">
      <span class="n-ic ${n.tone||''}">${I[n.icon]}</span>
      <span class="n-tx"><b>${esc(n.title)}</b><small>${esc(n.text)}</small>${n.when?`<time>${esc(n.when)}</time>`:''}</span>
      <span class="n-side">${n.unread?`<i class="n-dot" aria-label="${L('Neu','New')}"></i>`:''}${n.cta?`<span class="n-cta ${n.ctaTone||''}">${esc(n.cta)}</span>`:''}</span>
    </button>`;

  let LIST = [];
  function renderSheet(){
    LIST = build();
    const fresh = LIST.filter(n => n.unread), older = LIST.filter(n => !n.unread);
    const markable = fresh.filter(n => !n.urgent).length;
    let h = '<div class="grab"></div>';
    h += `<div class="n-head"><h3 id="nTitle">${L('Benachrichtigungen','Notifications')}</h3>${markable?`<button class="n-all" type="button" data-a="all">${L('Alle gelesen','Mark all read')}</button>`:''}</div>`;
    if(!LIST.length) h += `<div class="n-empty">${I.bell}<b>${L('Alles erledigt','All caught up')}</b>${L('Keine neuen Benachrichtigungen.','No new notifications.')}</div>`;
    if(fresh.length) h += `<p class="n-sec">${L('Neu','New')} · ${fresh.length}</p><div class="n-list">${fresh.map(n=>row(n, LIST.indexOf(n))).join('')}</div>`;
    if(older.length) h += `<p class="n-sec">${L('Früher','Earlier')}</p><div class="n-list">${older.map(n=>row(n, LIST.indexOf(n))).join('')}</div>`;
    h += `<div class="n-foot"><button type="button" data-a="close">${L('Schließen','Close')}</button></div>`;
    $('nsheet').innerHTML = h;
  }

  function renderBadge(){
    const n = build().filter(x => x.unread).length;
    document.querySelectorAll('#bellBtn, [data-bell]').forEach(b => {
      let s = b.querySelector('.nbadge');
      if(!n){ if(s) s.remove(); b.setAttribute('aria-label', L('Benachrichtigungen','Notifications')); return; }
      if(!s){ s = document.createElement('span'); s.className = 'nbadge'; b.appendChild(s); }
      s.textContent = n > 9 ? '9+' : n;
      b.setAttribute('aria-label', L('Benachrichtigungen, '+n+' neu','Notifications, '+n+' new'));
    });
  }

  /* ---------- Öffnen / Schließen ---------- */
  let opener = null;
  function open(){
    opener = document.activeElement;
    renderSheet();
    $('nscrim').classList.remove('hidden'); $('nsheet').classList.remove('hidden');
    $('nsheet').scrollTop = 0; $('nsheet').focus({preventScroll:true});
  }
  function close(){
    $('nscrim').classList.add('hidden'); $('nsheet').classList.add('hidden');
    markRead(LIST.filter(n => !n.urgent).map(n => n.id));   // gesehen = gelesen
    renderBadge();
    if(opener && opener.focus) opener.focus({preventScroll:true});
  }
  const isOpen = () => !$('nsheet').classList.contains('hidden');

  $('nsheet').onclick = e => {
    const a = e.target.closest('[data-a]');
    if(a){ if(a.dataset.a === 'close') close(); else { markRead(LIST.filter(n=>!n.urgent).map(n=>n.id)); renderSheet(); renderBadge(); } return; }
    const b = e.target.closest('[data-i]'); if(!b) return;
    const n = LIST[+b.dataset.i]; if(!n) return;
    markRead([n.id]);
    if(!n.go){ renderSheet(); renderBadge(); return; }
    $('nscrim').classList.add('hidden'); $('nsheet').classList.add('hidden');
    n.go();
    renderBadge();
  };
  $('nscrim').onclick = close;
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && isOpen()) close(); });

  document.querySelectorAll('#bellBtn, [data-bell]').forEach(b => b.onclick = open);
  /* Zustand ändert sich durch Tippen (Chat, Bewertung, Sprache …): Zähler danach auffrischen */
  document.addEventListener('click', () => setTimeout(renderBadge, 0));
  document.addEventListener('submit', () => setTimeout(renderBadge, 1000));

  renderBadge();
  window.GWNotif = {open, close, render:renderBadge};
})();
</script>
