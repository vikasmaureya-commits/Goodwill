<style>
/* ===== Ansicht / Rolle ===== */
.rolepick{display:flex;flex-direction:column;gap:10px;}
.rcard{display:grid;grid-template-columns:52px 1fr 26px;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:20px;background:rgba(255,255,255,.8);border:1.5px solid var(--line);}
.rcard.on{border-color:#1F7A59;background:#fff;box-shadow:0 8px 22px -14px rgba(31,122,89,.6);}
.rcard .ric{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.rcard .ric svg{width:26px;height:26px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ric.r-recv{background:rgba(110,170,140,.2);} .ric.r-recv svg{stroke:#2F6B55;}
.ric.r-help{background:rgba(240,190,160,.45);} .ric.r-help svg{stroke:#8A4A14;}
.ric.r-guard{background:rgba(150,170,220,.28);} .ric.r-guard svg{stroke:#3A4F8A;}
.rcard b{display:block;font-weight:600;font-size:1.05rem;}
.rcard small{display:block;font-size:.85rem;color:var(--mute);line-height:1.35;margin-top:2px;}
.rcard .rck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
.rcard.on .rck{background:#1F7A59;border-color:#1F7A59;}
.rcard .rck svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.r-title{font-weight:500;font-size:1.45rem;letter-spacing:-.01em;}
.r-sub{color:var(--mute);font-size:.95rem;margin-top:-8px;}
body.role-helper #s-home .tiles, body.role-guardian #s-home .tiles{display:none;}
body.role-helper #s-home .herophoto, body.role-guardian #s-home .herophoto{max-height:150px;}
#roleHome{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
#roleHome:empty{display:none;}
.rh-sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin-top:4px;}
.rh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.rh-stat{padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid var(--line);text-align:center;}
.rh-stat b{display:block;font-size:1.3rem;font-weight:600;color:#1F5C45;}
.rh-stat small{display:block;font-size:.74rem;color:var(--mute);line-height:1.2;}
.rh-card{padding:14px;border-radius:20px;background:rgba(255,255,255,.85);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;}
.rh-top{display:flex;align-items:center;gap:12px;}
.rh-av{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#2F6B55;background:rgba(110,170,140,.22);}
.rh-top .t{flex:1;min-width:0;} .rh-top b{display:block;font-weight:600;}
.rh-top small{display:block;font-size:.82rem;color:var(--mute);}
.rh-items{font-size:.92rem;color:#3B464C;line-height:1.4;}
.rh-when{font-size:.82rem;color:var(--mute);}
.rh-acts{display:flex;gap:8px;}
.rh-btn{flex:1;min-height:48px;border-radius:14px;font-weight:600;font-size:.95rem;}
.rh-btn.pri{background:#1F7A59;color:#fff;}
.rh-btn.sec{border:1.3px solid rgba(47,107,85,.45);color:#2F6B55;background:rgba(255,255,255,.7);}
.rh-btn.done{background:rgba(31,122,89,.12);color:#1F5C45;cursor:default;}
.rh-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem;}
.rh-row:first-of-type{border-top:none;}
.rh-row span{flex:1;min-width:0;} .rh-row small{display:block;color:var(--mute);font-size:.8rem;}
.rh-ok{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(120,135,128,.14);}
.rh-ok svg{width:16px;height:16px;stroke:#5E6B64;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
</style>
<div class="scrim hidden" id="rscrim"></div>
<div class="sheet nsx hidden" id="rsheet" role="dialog" aria-modal="true" aria-labelledby="rTitle" tabindex="-1" data-dyn></div>
<script id="roles">
/* ============ ANSICHT: EMPFÄNGER · HELFER · BETREUER ============
   Die gewählte Rolle bestimmt die Startseite. Wird gespeichert. */
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const en = () => LANG === 'en';
  const A = window.GWApp;
  const KEY = 'gw-role-v1';

  let R = {role:'recv', accepted:{}, approvals:{}};
  try{ const x = JSON.parse(localStorage.getItem(KEY)); if(x && typeof x === 'object') R = Object.assign(R, x); }catch(e){}
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(R)); }catch(e){} };

  const I = {
    recv:'<svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/><path d="M10 19v-5h4v5"/></svg>',
    help:'<svg viewBox="0 0 24 24"><path d="M5.2 8.5h13.6l-1.1 10.6a1.6 1.6 0 0 1-1.6 1.4H7.9a1.6 1.6 0 0 1-1.6-1.4L5.2 8.5z"/><path d="M8.8 8.5V7a3.2 3.2 0 0 1 6.4 0v1.5"/></svg>',
    guard:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9.5 12.5a2.5 2.5 0 0 1 5 0"/><circle cx="12" cy="9.5" r="1.6"/></svg>',
    check:'<svg viewBox="0 0 24 24"><path d="M4.5 12.8l5 5L19.5 7"/></svg>',
    eye:'<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>'
  };
  const ROLES = [
    {id:'recv',  icon:'recv',  de:'Empfänger',         en:'Receiver',
     dde:'Ich bekomme Hilfe beim Einkaufen und im Alltag.', den:'I get help with shopping and everyday tasks.'},
    {id:'help',  icon:'help',  de:'Helfer',            en:'Helper',
     dde:'Ich helfe Menschen in meiner Nachbarschaft.',    den:'I help people in my neighbourhood.'},
    {id:'guard', icon:'guard', de:'Betreuer',          en:'Guardian',
     dde:'Ich kümmere mich um einen Angehörigen und gebe Bestellungen frei.', den:'I look after a relative and approve their orders.'}
  ];
  const role = () => ROLES.find(r => r.id === R.role) || ROLES[0];
  const rName = r => en() ? r.en : r.de;

  /* ---------- Demo-Daten ---------- */
  const OPEN = [
    {id:'weber',  who:'Margarete Weber', ini:'MW', area:'Altstadt',      km:'0,4', kmEn:'0.4',
     de:'Milch, Brot, Äpfel',                en:'Milk, bread, apples',            wde:'Heute · sobald möglich', wen:'Today · as soon as possible'},
    {id:'schulz', who:'Herr Schulz',     ini:'S',  area:'Stadtfeld Ost', km:'1,2', kmEn:'1.2',
     de:'Rezept in der Apotheke abholen',    en:'Pick up a prescription at the pharmacy', wde:'Morgen · Vormittag', wen:'Tomorrow · morning'},
    {id:'yilmaz', who:'Frau Yilmaz',     ini:'Y',  area:'Sudenburg',     km:'2,0', kmEn:'2.0',
     de:'Wocheneinkauf (7 Artikel)',         en:'Weekly shop (7 items)',          wde:'Fr. · Nachmittag',  wen:'Fri · afternoon'}
  ];
  const PENDING = [
    {id:'ap1', de:'Kaffee, Butter, Joghurt', en:'Coffee, butter, yoghurt', wde:'Heute, 09:12', wen:'Today, 9:12 am'}
  ];

  /* ---------- Startseite je Rolle ---------- */
  const homeTitle = $('s-home').querySelector('h1.display'), homeLead = $('s-home').querySelector('p.lead');
  let host = $('roleHome');
  if(!host){ host = document.createElement('div'); host.id = 'roleHome'; $('s-home').querySelector('.tiles').after(host); }

  function helperHome(){
    const sc = window.GWHon && GWHon.score ? GWHon.score('akash') : 82;
    const n = 26 + Object.keys(R.accepted).length;
    let h = `<div class="rh-stats">
      <div class="rh-stat"><b>${n}</b><small>${L('Hilfen','Times helped')}</small></div>
      <div class="rh-stat"><b>${sc}</b><small>${L('Ehrlichkeit','Honesty')}</small></div>
      <div class="rh-stat"><b>${OPEN.length - Object.keys(R.accepted).length}</b><small>${L('Offen in der Nähe','Open nearby')}</small></div></div>`;
    h += `<p class="rh-sec">${L('Anfragen in Ihrer Nähe','Requests near you')}</p>`;
    h += OPEN.map(o => {
      const done = R.accepted[o.id];
      return `<div class="rh-card"><div class="rh-top"><span class="rh-av">${esc(o.ini)}</span><span class="t"><b>${esc(o.who)}</b><small>${esc(o.area)} · ${en()?o.kmEn:o.km} km</small></span></div>
        <div class="rh-items">${esc(en()?o.en:o.de)}</div><div class="rh-when">${esc(en()?o.wen:o.wde)}</div>
        <div class="rh-acts">${done
          ? `<button class="rh-btn done" type="button" disabled>${I.check.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:2.4"')} ${L('Übernommen','Accepted')}</button><button class="rh-btn sec" type="button" data-r="undo" data-id="${o.id}">${L('Zurückgeben','Give back')}</button>`
          : `<button class="rh-btn pri" type="button" data-r="accept" data-id="${o.id}">${L('Übernehmen','Accept')}</button>`}</div></div>`;
    }).join('');
    return h;
  }

  function guardianHome(){
    const orders = (A.ORDERS || []).slice(0,3);
    let h = `<div class="rh-card"><div class="rh-top"><span class="rh-av">MW</span><span class="t"><b>Margarete Weber</b><small>${L('Sie betreuen · Altstadt, Magdeburg','You look after · Altstadt, Magdeburg')}</small></span></div>
      <div class="rh-acts"><button class="rh-btn pri" type="button" data-r="orderfor">${L('Für sie bestellen','Order for her')}</button></div></div>`;
    const open = PENDING.filter(p => !R.approvals[p.id]);
    h += `<p class="rh-sec">${L('Freigaben','Approvals')}${open.length ? ' · '+open.length : ''}</p>`;
    h += open.length ? open.map(p => `<div class="rh-card"><div class="rh-items"><b>${L('Neue Bestellung','New order')}</b><br>${esc(en()?p.en:p.de)}</div><div class="rh-when">${esc(en()?p.wen:p.wde)}</div>
        <div class="rh-acts"><button class="rh-btn pri" type="button" data-r="approve" data-id="${p.id}">${L('Freigeben','Approve')}</button><button class="rh-btn sec" type="button" data-r="decline" data-id="${p.id}">${L('Ablehnen','Decline')}</button></div></div>`).join('')
      : `<div class="rh-card"><div class="rh-items">${L('Keine offenen Freigaben. Alles erledigt.','No open approvals. All done.')}</div>${PENDING.some(p=>R.approvals[p.id])?`<div class="rh-acts"><button class="rh-btn sec" type="button" data-r="resetap">${L('Beispiel erneut zeigen','Show example again')}</button></div>`:''}</div>`;
    h += `<p class="rh-sec">${L('Letzte Bestellungen','Recent orders')}</p><div class="rh-card">` +
      orders.map(o => `<div class="rh-row"><span class="rh-ok">${I.check}</span><span>${L('Von ','By ')+esc(o.who)}<small>${esc(en()?o.en:o.de)}</small></span></div>`).join('') + '</div>';
    return h;
  }

  const HOME0 = {title: homeTitle.innerHTML, lead: homeLead.innerHTML};
  function renderHome(){
    const r = R.role;
    document.body.classList.toggle('role-helper', r === 'help');
    document.body.classList.toggle('role-guardian', r === 'guard');
    if(r === 'help'){
      homeTitle.innerHTML = L('Danke, dass<br>Sie helfen.','Thank you<br>for helping.');
      homeLead.textContent = L('Diese Nachbarn brauchen gerade Unterstützung.','These neighbours need support right now.');
      host.innerHTML = helperHome();
    } else if(r === 'guard'){
      homeTitle.innerHTML = L('Gut umsorgt –<br>auch aus<br>der Ferne.','Well cared for –<br>even from<br>afar.');
      homeLead.textContent = L('Behalten Sie die Einkäufe Ihrer Angehörigen im Blick.','Keep an eye on your relative’s shopping.');
      host.innerHTML = guardianHome();
    } else {
      homeTitle.innerHTML = L('Gemeinsam<br>für ein besseres<br>Morgen.','Together<br>for a better<br>tomorrow.');
      homeLead.textContent = L('Alltagshilfe von Menschen aus Ihrer Nachbarschaft – kostenlos.','Everyday help from people in your neighbourhood – free of charge.');
      host.innerHTML = '';
    }
  }

  host.onclick = e => {
    const b = e.target.closest('[data-r]'); if(!b) return;
    const a = b.dataset.r, id = b.dataset.id;
    if(a === 'accept'){ R.accepted[id] = Date.now(); const o = OPEN.find(x=>x.id===id); A.toast(L('Danke! '+o.who+' wurde informiert.','Thanks! '+o.who+' has been informed.')); }
    else if(a === 'undo'){ delete R.accepted[id]; A.toast(L('Anfrage zurückgegeben','Request given back')); }
    else if(a === 'approve'){ R.approvals[id] = 'ok'; A.toast(L('Bestellung freigegeben – Helfer werden informiert','Order approved – helpers are being informed')); }
    else if(a === 'decline'){ R.approvals[id] = 'no'; A.toast(L('Bestellung abgelehnt','Order declined')); }
    else if(a === 'resetap'){ R.approvals = {}; }
    else if(a === 'orderfor'){ A.startRequest(null); return; }
    save(); renderHome();
  };

  /* ---------- Profil-Zeile ---------- */
  let prow = $('roleRow');
  if(!prow){
    prow = document.createElement('button');
    prow.type = 'button'; prow.id = 'roleRow'; prow.className = 'prow glass';
    $('careBanner').before(prow);
    prow.onclick = open;
  }
  function renderRow(){
    prow.innerHTML = `<span class="ci">${I.eye}</span><span class="tx">${L('Ansicht','View')}</span><em class="val">${esc(rName(role()))}</em><svg class="r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`;
  }

  /* ---------- Auswahl-Dialog ---------- */
  let opener = null;
  function renderSheet(){
    $('rsheet').innerHTML = `<div class="grab"></div><h3 class="r-title" id="rTitle">${L('Ansicht wählen','Choose your view')}</h3>
      <p class="r-sub">${L('Wie möchten Sie Goodwill nutzen? Sie können das jederzeit ändern.','How would you like to use Goodwill? You can change this at any time.')}</p>
      <div class="rolepick" role="radiogroup" aria-labelledby="rTitle">${ROLES.map(r => `<button class="rcard${r.id===R.role?' on':''}" type="button" role="radio" aria-checked="${r.id===R.role}" data-role="${r.id}">
        <span class="ric r-${r.icon==='help'?'help':r.icon==='guard'?'guard':'recv'}">${I[r.icon]}</span>
        <span><b>${esc(rName(r))}</b><small>${esc(en()?r.den:r.dde)}</small></span><span class="rck">${r.id===R.role?I.check:''}</span></button>`).join('')}</div>
      <div class="n-foot"><button type="button" data-a="close">${L('Schließen','Close')}</button></div>`;
  }
  function open(){
    opener = document.activeElement; renderSheet();
    $('rscrim').classList.remove('hidden'); $('rsheet').classList.remove('hidden');
    $('rsheet').scrollTop = 0; $('rsheet').focus({preventScroll:true});
  }
  function close(){
    $('rscrim').classList.add('hidden'); $('rsheet').classList.add('hidden');
    if(opener && opener.focus) opener.focus({preventScroll:true});
  }
  $('rsheet').onclick = e => {
    if(e.target.closest('[data-a=close]')) return close();
    const c = e.target.closest('[data-role]'); if(!c) return;
    R.role = c.dataset.role; save(); render(); close();
    A.state.nav = ['home']; A.show('home', false);
    A.toast(L('Ansicht: ','View: ') + rName(role()));
  };
  $('rscrim').onclick = close;
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('rsheet').classList.contains('hidden')) close(); });

  function render(){ renderHome(); renderRow(); }
  /* Sprache wird per Tippen geändert: danach neu zeichnen */
  let lastLang = LANG;
  document.addEventListener('click', () => setTimeout(() => { if(LANG !== lastLang){ lastLang = LANG; render(); } }, 0));

  render();
  window.GWRole = {open, render, role:() => R.role};
})();
</script>
